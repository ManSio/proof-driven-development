name: gates

on:
  push:
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: doctor selftest
        run: python scripts/doctor.py --selftest
      - name: doctor
        run: python scripts/doctor.py --root .
      - name: inventory selftest
        run: python scripts/skill_inventory.py --selftest
      - name: inventory
        run: python scripts/skill_inventory.py --root .
